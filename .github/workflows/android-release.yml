name: Android Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version name, for example 1.0.0"
        required: true
        default: "1.0.0"
      version_code:
        description: "Integer Android version code. Must increase for Play Store uploads."
        required: true

env:
  RELEASE_VERSION: ${{ github.event.inputs.release_version || vars.CURIOVERSE_RELEASE_VERSION || '1.0.0' }}
  RELEASE_BUILD_NUMBER: ${{ github.event.inputs.version_code || github.run_number }}

jobs:
  build:
    name: Validate and package Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate release branding and privacy policy
        run: python3 scripts/validate-release-branding.py
      - name: Generate Android project
        run: flutter create --org com.tvcext --project-name curioverse --platforms=android .
      - name: Configure Android branding and capabilities
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          additions = '''    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          '''
          marker = ">\n    <application"
          if "android.permission.INTERNET" not in source:
              source = source.replace(marker, ">\n" + additions + "    <application", 1)

          source = source.replace('android:label="curioverse"', 'android:label="Euphoriks Quizzie"')
          source = source.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/quizzie_launcher"')
          manifest.write_text(source)

          drawable_dir = Path("android/app/src/main/res/drawable")
          drawable_dir.mkdir(parents=True, exist_ok=True)
          (drawable_dir / "quizzie_launcher.xml").write_text(
              Path("store-assets/android/quizzie_launcher.xml").read_text()
          )
          PY
          grep -q 'android:label="Euphoriks Quizzie"' android/app/src/main/AndroidManifest.xml
          grep -q '@drawable/quizzie_launcher' android/app/src/main/AndroidManifest.xml
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Audit merged release manifest
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android app:processReleaseMainManifest
          manifest=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)
          test -n "$manifest"
          cp "$manifest" quizzie-merged-release-manifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("quizzie-merged-release-manifest.xml").getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          permissions = sorted({n.attrib.get(ns + "name", "") for n in root if n.tag in {"uses-permission", "uses-permission-sdk-23"}} - {""})
          expected = {"android.permission.INTERNET", "android.permission.CAMERA"}
          blocked = {"android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION", "android.permission.READ_CONTACTS", "android.permission.WRITE_CONTACTS", "android.permission.RECORD_AUDIO", "android.permission.READ_PHONE_STATE", "android.permission.CALL_PHONE", "android.permission.READ_SMS", "android.permission.SEND_SMS"}
          missing = expected - set(permissions)
          unexpected = blocked.intersection(permissions)
          if missing: raise SystemExit("Missing expected permissions: " + ", ".join(sorted(missing)))
          if unexpected: raise SystemExit("Unexpected sensitive permissions: " + ", ".join(sorted(unexpected)))
          PY
      - name: Decode Play upload keystore
        id: signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.CURIOVERSE_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.CURIOVERSE_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.CURIOVERSE_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.CURIOVERSE_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ] || [ -z "$UPLOAD_KEY_ALIAS" ] || [ -z "$UPLOAD_KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured; signed AAB will be skipped."
            exit 0
          fi
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$UPLOAD_KEYSTORE_PASSWORD
          keyPassword=$UPLOAD_KEY_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Configure Gradle release signing
        if: steps.signing.outputs.configured == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          source = path.read_text()
          source = source.replace("plugins {", '''import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          plugins {''', 1)
          source = source.replace("android {", '''android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }''', 1)
          source = source.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          path.write_text(source)
          PY
      - name: Build tester APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --target-platform android-arm64 --split-debug-info=build/debug-info --build-name "$RELEASE_VERSION" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Build Play Store app bundle
        if: steps.signing.outputs.configured == 'true' && github.event_name != 'pull_request'
        run: flutter build appbundle --release --target-platform android-arm64 --split-debug-info=build/debug-info --build-name "$RELEASE_VERSION" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Prepare release artifacts
        if: github.event_name != 'pull_request'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk euphoriks-quizzie-latest.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then cp build/app/outputs/bundle/release/app-release.aab euphoriks-quizzie-play-store.aab; fi
      - name: Upload tester APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: euphoriks-quizzie-tester-apk
          path: euphoriks-quizzie-latest.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Play Store AAB artifact
        if: steps.signing.outputs.configured == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: euphoriks-quizzie-play-store-aab
          path: euphoriks-quizzie-play-store.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload merged manifest audit
        uses: actions/upload-artifact@v4
        with:
          name: euphoriks-quizzie-merged-release-manifest
          path: quizzie-merged-release-manifest.xml
          retention-days: 30
      - name: Write summary
        if: always()
        run: |
          echo "## Euphoriks Quizzie Android release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public display branding: Euphoriks Quizzie" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing package/application identity remains unchanged for Play continuity" >> "$GITHUB_STEP_SUMMARY"
          echo "- flutter analyze and flutter test executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- merged release manifest audited for Families-sensitive permissions" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK generated for non-PR builds" >> "$GITHUB_STEP_SUMMARY"
          echo "- signed Play Store AAB generated when upload-key secrets are configured" >> "$GITHUB_STEP_SUMMARY"
