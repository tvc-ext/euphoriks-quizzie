name: Update content repository URL

on:
  push:
    branches: [fix/content-repo-url]
    paths:
      - ".github/workflows/update-content-url.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/content-repo-url
          fetch-depth: 0
      - name: Update renamed content repository URL
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/data/question_banks.dart')
          text = path.read_text()
          old = 'https://raw.githubusercontent.com/tvc-ext/-curioverse-content/main'
          new = 'https://raw.githubusercontent.com/tvc-ext/euphoriks-quizzie-content/main'
          if old not in text:
              raise SystemExit('Old content repository URL not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit URL update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/question_banks.dart
          git commit -m "Update Quizzie content repository URL"
          git push origin HEAD:fix/content-repo-url
